<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="STRIVA — Your premium AI-powered fitness companion for tracking workouts, macros, and reaching peak performance." />
  
  <!-- PWA Meta Tags (kept for display only; service worker disabled) -->
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STRIVA" />
  <meta name="application-name" content="STRIVA" />
  <meta name="msapplication-TileColor" content="#121212" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Icons -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192x192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
  
  <!-- manifest link removed — PWA/SW disabled -->
  
  <!-- Preload & Preconnect for critical assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <title>STRIVA</title>

  <!-- Unregister any previously installed service worker immediately -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
          console.log('[SW] Unregistered stale service worker:', registration.scope);
        }
      });
    }
  </script>
</head>

<body style="margin:0;background:#121212;">
  <div id="app-loader" style="
    position:fixed;inset:0;background:#121212;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:20px;z-index:9999;">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
      stroke="#22c55e" stroke-width="2" stroke-linecap="round">
      <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
      <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
      <line x1="6" y1="1" x2="6" y2="4"/>
      <line x1="10" y1="1" x2="10" y2="4"/>
      <line x1="14" y1="1" x2="14" y2="4"/>
    </svg>
    <div style="
      width:36px;height:36px;
      border:3px solid #1f1f1f;
      border-top:3px solid #22c55e;
      border-radius:50%;
      animation:spin 0.8s linear infinite;">
    </div>
    <style>
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </div>
  <div id="root"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.3s ease';
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), 
        { childList: true });
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
