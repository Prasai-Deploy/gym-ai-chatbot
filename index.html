<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Sweatfix AI — Your premium AI-powered fitness companion for tracking workouts, macros, and reaching peak performance." />
  
  <!-- PWA Meta Tags (kept for display only; service worker disabled) -->
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sweat Fix" />
  <meta name="application-name" content="Sweat Fix" />
  <meta name="msapplication-TileColor" content="#121212" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Icons -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192x192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
  
  <!-- manifest link removed — PWA/SW disabled -->
  
  <!-- Preload & Preconnect for critical assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <title>Sweatfix Ai</title>

  <!-- Unregister any previously installed service worker immediately -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
          console.log('[SW] Unregistered stale service worker:', registration.scope);
        }
      });
    }
  </script>
</head>

<body>
  <div id="app-loader" style="
    position:fixed; inset:0; background:#09090b;
    display:flex; align-items:center; justify-content:center;
    z-index:9999; flex-direction:column; gap:16px;
  ">
    <div style="
      width:40px; height:40px; border:3px solid #27272a;
      border-top-color:#10b981; border-radius:50%;
      animation:spin 0.8s linear infinite;
    "></div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
